name: Android

on:
  push:
    branches-ignore:
      - 'l10n_**'
  pull_request:

jobs:
  build:
    name: Android
    runs-on: ubuntu-latest

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get -y install ccache libcurl4-openssl-dev

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-android-${{ github.sha }}
          restore-keys: ccache-android-

      - name: Disable release signing
        run: sed -i 's/signingConfigs.getByName("release")/signingConfigs.getByName("debug")/' shell/android-studio/flycast/build.gradle.kts
        if: github.repository != 'OrangeFox86/Hollycast' || github.event_name != 'push'

      - name: Bump version code
        run: sed -i 's/versionCode = 8/versionCode = ${{ github.run_number }}/' shell/android-studio/flycast/build.gradle.kts

      - name: Decode Keystore
        run: |
          # This replaces the playstore keystore file which is used for Flycast with the decoded one used for Hollycast
          # This variable was generated using `base64 -w 0 playstore.jks`
          echo "${{ secrets.ANDROID_KEYSTORE_FILE }}" | base64 --decode > shell/android-studio/playstore.jks

      - name: Gradle
        working-directory: shell/android-studio
        run: ./gradlew assembleRelease bundleRelease --parallel
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: Hollycast-release.apk
          path: shell/android-studio/flycast/build/outputs/apk/release/Hollycast-release.apk

      - name: Build dump_syms
        working-directory: core/deps/breakpad
        run: |
          ./configure --prefix=$PWD
          make -j2
          make install

      - name: Extract symbols
        run: |
          DUMP_SYMS=./core/deps/breakpad/bin/dump_syms
          SO_DIR=shell/android-studio/flycast/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib
          for arch in arm64-v8a armeabi-v7a x86 x86_64 ; do
            $DUMP_SYMS $SO_DIR/$arch/libHollycast.so > libHollycast.so.sym
            BUILD_ID=`head -1 libHollycast.so.sym | awk '{ print $4 }'`
            mkdir -p symbols/libHollycast.so/$BUILD_ID
            mv libHollycast.so.sym symbols/libHollycast.so/$BUILD_ID
          done

      # Removed Sentry and Rclone steps until they are properly setup for Hollycast
